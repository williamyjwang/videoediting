# A paid always-on service with a persistent disk. Review current pricing in
# Render before creating it. One instance only: this version uses a disk queue.
services:
  - type: web
    name: mcc-content-studio
    runtime: docker
    plan: standard
    numInstances: 1
    healthCheckPath: /api/health
    disk:
      name: mcc-studio-data
      mountPath: /var/data
      sizeGB: 20
    envVars:
      - key: NODE_ENV
        value: production
      - key: MCC_DATA_DIR
        value: /var/data
      - key: MCC_EDIT_PROVIDER
        value: codex
      - key: MCC_AI_MAX_SOURCE_SECONDS
        value: "60"
      - key: MCC_ADMIN_PASSWORD
        sync: false
      - key: MCC_SESSION_SECRET
        generateValue: true
      - key: MCC_OPENAI_API_KEY
        sync: false
